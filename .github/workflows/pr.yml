name: PR Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent_pwd
          POSTGRES_DB: my_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # ── Go ──
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: control-plane/go.sum

      # genproto 由 proto/ 生成且被 gitignore，CI 内先再生成（插件版本与 Dockerfile 对齐）
      - name: Install buf and Go protobuf plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate Go proto stubs
        run: buf generate

      - name: Go lint (go vet)
        working-directory: control-plane
        run: go vet ./...

      - name: Go test (race)
        working-directory: control-plane
        env:
          TEST_PG_DSN: postgres://agent:agent_pwd@localhost:5432/my_agent_test
        # -p 1 串行执行包：store/api 等包共享同一 PG 测试库并各自 TRUNCATE，并行会互相清空/读到对方数据
        run: go test -race -count=1 -p 1 ./...

      # ── Python ──
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      # cognition 侧 stub 同样由 proto/ 生成（被 gitignore），pytest 前先再生成
      - name: Generate Python proto stubs
        working-directory: cognition
        run: |
          mkdir -p cognition/genproto
          uv run python -m grpc_tools.protoc \
            -I ../proto \
            --python_out=cognition/genproto \
            --grpc_python_out=cognition/genproto \
            --pyi_out=cognition/genproto \
            ../proto/agent/v1/agent.proto
          find cognition/genproto -type d -exec touch {}/__init__.py \;

      - name: Python lint (ruff)
        working-directory: cognition
        # ruff/pytest 在 optional dev extras，uv run 默认不装，须显式 --extra dev
        run: uv run --extra dev ruff check .

      - name: Python test
        working-directory: cognition
        run: uv run --extra dev pytest -q

      # ── TypeScript ──
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Web unit tests
        working-directory: web
        run: npm run test

      # ── Docker build (no push) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build control-plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.control-plane
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build cognition image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.cognition
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
